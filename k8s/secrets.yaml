# Example only. Never commit real secrets.
# In a real environment, create it from the CLI or use a secret manager
# (Sealed Secrets, External Secrets + AWS Secrets Manager):
#   kubectl create secret generic app-secret -n my-app --from-literal=DB_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: my-app
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
